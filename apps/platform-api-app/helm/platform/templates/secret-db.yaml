{{/*
Database password Secret.
Created only when db.existingSecret is NOT set — i.e., when you are NOT
pointing to an externally managed secret (Vault, AWS Secrets Manager, etc.).

In production, set db.existingSecret to the name of your pre-existing secret
and this resource will NOT be rendered.
*/}}
{{- if not .Values.db.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-db
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- else }}
  # Set this via --set db.password=<value> or in your values override file.
  # Do NOT commit real passwords to version control.
  POSTGRES_PASSWORD: {{ .Values.db.password | default "changeme" | quote }}
  {{- end }}
{{- end }}
