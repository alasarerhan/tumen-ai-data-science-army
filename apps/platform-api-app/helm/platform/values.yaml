# Default values for the Platform API Helm chart.
# Override these in your environment-specific values files.

# ---------------------------------------------------------------------------
# Replica count and autoscaling
# ---------------------------------------------------------------------------
replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Container image
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-datascience-team/platform-api
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []

# ---------------------------------------------------------------------------
# Service account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# Pod configuration
# ---------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8000"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: platform-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: platform-api-tls
  #    hosts:
  #      - platform-api.example.com

# ---------------------------------------------------------------------------
# Resource limits and requests
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Health probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Node scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Application configuration (mounted as environment variables)
# Non-sensitive values go here; secrets go in `secrets`.
# ---------------------------------------------------------------------------
config:
  # FastAPI app bind address
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DEPLOYMENT_PROFILE: "release"

  # Authentication mode: "dev" or "oidc"
  AUTH_MODE: "oidc"

  # OIDC settings (only used when AUTH_MODE=oidc)
  OIDC_ISSUER: "https://accounts.google.com"
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""

  # Rate limit: write operations per tenant per minute
  TENANT_WRITE_QUOTA_PER_MINUTE: "120"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
db:
  # External PostgreSQL host (used when postgres.enabled=false)
  host: "postgres"
  port: "5432"
  name: "platform"
  user: "platform"
  # Reference to a Kubernetes Secret that holds the DB password
  # The secret must have a key named `POSTGRES_PASSWORD`
  existingSecret: ""
  existingSecretKey: "POSTGRES_PASSWORD"

# ---------------------------------------------------------------------------
# Bundled PostgreSQL (for development / CI — not for production)
# ---------------------------------------------------------------------------
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
  password: "postgres"
  storage:
    size: 5Gi
    storageClass: ""

# ---------------------------------------------------------------------------
# Extra environment variables injected into the API container
# Useful for overriding or extending config without editing this file.
# ---------------------------------------------------------------------------
extraEnv: []
# - name: SENTRY_DSN
#   value: "https://..."

extraEnvFrom: []
# - secretRef:
#     name: platform-api-extra-secrets
