name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.10"
  UV_VERSION: "0.9.21"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Python unit tests (fast — no external API calls)
  # ═══════════════════════════════════════════════════════════════════════
  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (uv, frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Run Python unit tests
        run: |
          uv run pytest tests/ -m "not integration and not e2e and not ml" -n auto -v \
            --tb=short --durations=10 \
            --junitxml=pytest-unit-report.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-report
          path: pytest-unit-report.xml

  # ═══════════════════════════════════════════════════════════════════════
  # Platform API tests (in-memory SQLite, no network)
  # ═══════════════════════════════════════════════════════════════════════
  platform-api-unit:
    name: Platform API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/platform-api-app/requirements-dev.txt
          pip install apps/platform-api-app/
          pip install pytest-xdist

      - name: Run Platform API tests
        run: |
          cd apps/platform-api-app
          pytest tests/ -n auto -v --tb=short \
            --junitxml=platform-api-report.xml

      - name: Upload platform API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-report
          path: apps/platform-api-app/platform-api-report.xml

  # ═══════════════════════════════════════════════════════════════════════
  # Frontend Vitest unit tests
  # ═══════════════════════════════════════════════════════════════════════
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/

  # ═══════════════════════════════════════════════════════════════════════
  # Frontend Playwright E2E tests
  # ═══════════════════════════════════════════════════════════════════════
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ═══════════════════════════════════════════════════════════════════════
  # Python lint + type check
  # ═══════════════════════════════════════════════════════════════════════
  python-quality:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (uv, frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check ai_data_science_team/ tests/ apps/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check ai_data_science_team/ tests/ apps/ || echo "Format check failed (non-blocking)"
