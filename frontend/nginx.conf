# TÜMEN AI Data Science Platform — Frontend nginx
#
# Serves the Vite-built static SPA and proxies API requests to the
# platform-api backend (which may be on a separate container / host).
#
# Environment variables (injected at container runtime via docker compose):
#   API_BACKEND_URL  — e.g. http://api:8000  (default: http://api:8000)

server {
    listen       80;
    server_name  localhost;

    # ── Compressed assets ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── API proxy ──
    location /v1/ {
        proxy_pass ${API_BACKEND_URL:-http://api:8000};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for streaming / chat
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffering off for SSE streaming
        proxy_buffering off;
        proxy_cache off;
    }

    location /healthz {
        proxy_pass ${API_BACKEND_URL:-http://api:8000};
        proxy_set_header Host $host;
    }

    # ── WebSocket / SSE proxy for chat streaming ──
    location /ws/ {
        proxy_pass ${API_BACKEND_URL:-http://api:8000};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Static assets (fingerprinted — long cache) ──
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — all non-file routes serve index.html ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # HTML is not cached
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Error pages ──
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
