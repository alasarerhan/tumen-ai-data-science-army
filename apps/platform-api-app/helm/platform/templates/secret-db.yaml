{{/*
Database password Secret.
Created only when db.existingSecret is NOT set — i.e., when you are NOT
pointing to an externally managed secret (Vault, AWS Secrets Manager, etc.).

In production, set db.existingSecret to the name of your pre-existing secret
and this resource will NOT be rendered.
*/}}
{{- if not .Values.db.existingSecret -}}
{{- $weakPasswordMsg := "Set a non-default database password or use db.existingSecret. Weak defaults such as changeme/postgres/password are not allowed." -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-db
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- $postgresPassword := .Values.postgres.password | default "" -}}
  {{- if or (not $postgresPassword) (eq $postgresPassword "changeme") (eq $postgresPassword "postgres") (eq $postgresPassword "password") }}
  {{- fail $weakPasswordMsg }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- else }}
  {{- $dbPassword := .Values.db.password | default "" -}}
  {{- if or (not $dbPassword) (eq $dbPassword "changeme") (eq $dbPassword "postgres") (eq $dbPassword "password") }}
  {{- fail $weakPasswordMsg }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  {{- end }}
{{- end }}
