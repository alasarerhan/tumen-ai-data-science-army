[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-science-team"
version = "0.1.0"
description = "AI Data Science Team - A collection of AI agents for data science tasks"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Erhan", email = "erhan@example.com"}
]

dependencies = [
    "openai",
    "streamlit",
    "pandas",
    "langchain-community",
    "langchain-openai",
    "plotly",
    "matplotlib",
    "sweetviz",
    "dtale",
    "missingno",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools]
packages = ["ai_data_science_team"]
