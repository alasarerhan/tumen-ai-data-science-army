[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-science-team"
version = "0.1.0"
description = "AI Data Science Team - A collection of AI agents for data science tasks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Erhan", email = "erhan@example.com"}
]

dependencies = [
    # --- Agentic stack (LangChain 1.x + LangGraph) ---
    # langchain>=1.x pulls langgraph transitively; declared explicitly for clarity.
    "langchain>=1.0.0",
    "langchain-core",
    "langchain-community",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "typing-extensions",
    "openai",
    # --- Data science core ---
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "IPython",
    "plotly",
    "matplotlib",
    "Pillow",
    # --- Persistence / runtime ---
    "sqlalchemy",
    "redis",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
    "black",
    "flake8",
    "ruff",
]
# Heavy ML stack (pytest marker: ml). Lazy-imported by tool modules.
ml = [
    "h2o",
    "xgboost",
    "lightgbm",
    "prophet",
    "shap",
]
# Legacy viz extras kept for compatibility (not imported by inner package).
viz = [
    "sweetviz",
    "dtale",
    "missingno",
]
# MLOps / orchestration (lazy-imported).
mlops = [
    "mlflow",
    "prefect",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_data_science_team*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: end-to-end tests that call the real LLM API (requires OPENAI_API_KEY)",
    "e2e: full pipeline tests using real platform agents and real CSV data (requires OPENAI_API_KEY)",
    "m21: tests scoped to Milestone 21 (ChatWorkspace)",
    "m22: tests scoped to Milestone 22 (orchestration primitives)",
    "m23: tests scoped to Milestone 23 agents",
    "m24: tests scoped to Milestone 24 agents",
    "m25: tests scoped to Milestone 25 agents",
    "thread_safe: tests that verify thread safety of concurrent operations",
    "real: tests using real fixtures (CSV/SQL/JSON/PDF/XLSX under tests/fixtures/real/)",
    "ml: tests requiring ML stack (sklearn/xgboost/lightgbm/prophet/h2o/shap)",
    "llm: gerçek LLM API testleri (OPENAI_API_KEY + OPENAI_MODEL gerekir; mock/stub yok)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "ARG001",  # unused-function-argument (445): tool uniform signature
    "ARG002",  # unused-method-argument (79): agent uniform signature
    "ARG005",  # unused-lambda-argument (27): callback uniform signature
]
